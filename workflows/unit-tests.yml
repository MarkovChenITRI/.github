name: Unit Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-pages.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-pages.yml'
      - 'README.md'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall app.py utils tests

      - name: Check static JavaScript syntax
        run: |
          for file in static/js/*.js; do
            node --check "$file"
          done

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Health endpoint smoke test
        env:
          SECRET_KEY: ci-secret-key
          ADMIN_DEFAULT_PASSWORD: ci-admin-password
          FLASK_DEBUG: 'false'
        run: |
          python - <<'PY'
          from app import app

          with app.test_client() as client:
              response = client.get('/healthz')
              assert response.status_code == 200
              payload = response.get_json()
              assert payload['status'] == 'ok'
          PY
